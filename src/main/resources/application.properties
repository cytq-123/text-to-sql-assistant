# Spring Boot 配置
spring.application.name=text-to-sql-assistant
server.port=8080

# 通义千问 API Key
dashscope.api.key=sk-***

# 数据库配置（可选，用于执行SQL）
spring.datasource.url=jdbc:mysql://localhost:3306/test?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 日志配置
logging.level.root=INFO
logging.level.com.sql.assistant=DEBUG

# JSON 配置
spring.jackson.serialization.indent-output=true