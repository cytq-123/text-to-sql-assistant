<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Text-to-SQL 智能生成助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .input-section textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        .input-section textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .config-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .config-item {
            flex: 1;
            min-width: 200px;
        }
        
        .config-item label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .config-item select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .output-section {
            margin-top: 30px;
            display: none;
        }
        
        .output-section.show {
            display: block;
        }
        
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .output-header h3 {
            font-size: 20px;
            color: #333;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .sql-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .result-table {
            margin-top: 20px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        table th, table td {
            padding: 12px;
            text-align: left;
            border: 1px solid #e0e0e0;
        }
        
        table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        table tr:hover {
            background: #f8f9fa;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .examples {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .examples h4 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .example-item {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .example-item:hover {
            background: #e9ecef;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .error-section {
            background: #fff8f8;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .error-section label {
            color: #c92a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Text-to-SQL 智能生成助手</h1>
            <p>输入自然语言，一键生成SQL查询语句</p>
        </div>
        
        <div class="content">
            <!-- 表结构输入（牛客题目专用） -->
            <div class="input-section">
                <label for="tableSchema">📋 表结构（支持表格样本自动推断）</label>
                <textarea 
                    id="tableSchema" 
                    rows="10"
                    placeholder="方式1 - 粘贴表格样本（推荐）：

表名: user_profile
样本数据：
id | device_id | gender | age | university | province
1  | 2138      | male   | 21  | 北京大学    | Beijing
2  | 3214      | male   | 22  | 复旦大学    | Shanghai
3  | 6543      | female | 20  | 北京大学    | Beijing

方式2 - 标准格式：
表名: user_profile
字段:
  id INT - 用户ID
  device_id INT - 设备ID
  gender VARCHAR(10) - 性别
  age INT - 年龄
  university VARCHAR(100) - 大学
  province VARCHAR(50) - 省份

留空则使用默认示例"
                    style="font-family: 'Courier New', monospace; font-size: 13px;"
                ></textarea>
            </div>
            
            <!-- 题目需求 -->
            <div class="input-section">
                <label for="queryInput">📝 题目需求描述</label>
                <textarea 
                    id="queryInput" 
                    rows="3"
                    placeholder="粘贴题目需求，例如：现在运营想要查看所有来自浙江大学的用户信息"
                ></textarea>
            </div>
            
            <!-- 输出格式要求 -->
            <div class="input-section">
                <label for="outputFormat">📊 输出格式要求（可选）</label>
                <textarea 
                    id="outputFormat" 
                    rows="3"
                    placeholder="指定输出列名、排序等，例如：
输出格式：device_id, gender, age, university
排序：按id升序"
                ></textarea>
            </div>
            
            <!-- 错误反馈框 -->
            <div class="input-section" id="errorSection" style="display: none;">
                <label for="errorFeedback">⚠️ 错误反馈（用于增量修改）</label>
                <textarea 
                    id="errorFeedback" 
                    rows="3"
                    placeholder="描述需要修改的问题，例如：
- 格式问题：结果需要加上 % 符号
- 逻辑问题：计算方式不对，应该是...
- 字段问题：缺少某个字段

AI会基于当前SQL进行增量修改，而不是重新生成"
                    style="border-color: #ff6b6b;"
                ></textarea>
                <!-- 隐藏字段存储上次生成的SQL -->
                <input type="hidden" id="previousSQL" />
                <button class="btn-secondary" onclick="clearError()" style="margin-top: 10px;">清除错误反馈</button>
            </div>
            
            <!-- 配置选项 -->
            <div class="config-row">
                <div class="config-item">
                    <label>数据库类型</label>
                    <select id="sqlDialect">
                        <option value="mysql">MySQL</option>
                        <option value="postgresql">PostgreSQL</option>
                        <option value="sqlserver">SQL Server</option>
                        <option value="oracle">Oracle</option>
                        <option value="sqlite">SQLite</option>
                    </select>
                </div>
            </div>
            
            <!-- 生成按钮 -->
            <button class="btn-primary" id="generateBtn" onclick="generateSQL()">
                生成 SQL
            </button>
            
            
            <!-- 输出区域 -->
            <div class="output-section" id="outputSection">
                <div class="output-header">
                    <h3>🤖 生成的SQL</h3>
                    <div class="btn-group">
                        <button class="btn-secondary" onclick="copySQL()">📋 复制</button>
                        <button class="btn-secondary" onclick="reportError()">⚠️ 报错反馈</button>
                        <button class="btn-secondary" onclick="clearOutput()">🗑️ 清空</button>
                    </div>
                </div>
                
                <div class="sql-output" id="sqlOutput"></div>
                
                <div id="statusBadge"></div>
                
                <div class="stats" id="stats"></div>
                
                <!-- 查询结果 -->
                <div class="result-table" id="resultTable"></div>
            </div>
        </div>
    </div>
    
    <script>
        // 自动检测API地址：如果通过IP访问则使用相同IP，否则使用localhost
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:8080/api/sql'
            : `http://${window.location.hostname}:${window.location.port}/api/sql`;
        
        // 生成SQL
        async function generateSQL() {
            console.log('=== generateSQL 被调用 ===');
            
            const query = document.getElementById('queryInput').value.trim();
            const outputFormat = document.getElementById('outputFormat').value.trim();
            const errorFeedback = document.getElementById('errorFeedback').value.trim();
            const previousSQL = document.getElementById('previousSQL').value.trim();
            const tableSchema = document.getElementById('tableSchema').value.trim();
            const dialect = document.getElementById('sqlDialect').value;
            
            console.log('输入内容:', { query, outputFormat, errorFeedback, tableSchema, dialect });
            
            if (!query) {
                alert('请输入查询需求！');
                return;
            }
            
            // 显示加载状态
            const btn = document.getElementById('generateBtn');
            const originalText = btn.textContent;
            btn.textContent = '生成中...';
            btn.disabled = true;
            
            try {
                const requestBody = {
                    questionDescription: query,
                    outputFormat: outputFormat,
                    errorFeedback: errorFeedback,
                    previousSQL: previousSQL,
                    tableSchema: tableSchema,
                    sqlDialect: dialect,
                    executeSQL: false
                };
                
                console.log('请求URL:', `${API_BASE_URL}/generate`);
                console.log('请求体:', requestBody);
                
                const response = await fetch(`${API_BASE_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('响应结果:', result);
                
                // 显示结果
                showResult(result);
                
            } catch (error) {
                console.error('请求失败:', error);
                alert('请求失败：' + error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
        
        // 显示结果
        function showResult(result) {
            const outputSection = document.getElementById('outputSection');
            const sqlOutput = document.getElementById('sqlOutput');
            const statusBadge = document.getElementById('statusBadge');
            const stats = document.getElementById('stats');
            const resultTable = document.getElementById('resultTable');
            
            outputSection.classList.add('show');
            
            if (result.success) {
                // 使用 innerText 保留换行，或者转换为 HTML
                sqlOutput.innerText = result.generatedSQL;
                
                // 状态徽章
                const statusClass = result.syntaxValid ? 'status-success' : 'status-warning';
                const statusText = result.syntaxValid ? '✅ 语法检查通过' : '⚠️ 语法可能有误';
                statusBadge.innerHTML = `<span class="status-badge ${statusClass}">${statusText}</span>`;
                
                // 统计信息
                let statsHTML = `<div class="stat-item">⏱️ 耗时: ${result.executionTimeMs}ms</div>`;
                if (result.resultCount > 0) {
                    statsHTML += `<div class="stat-item">📊 返回: ${result.resultCount} 行</div>`;
                }
                stats.innerHTML = statsHTML;
                
                // 查询结果表格
                if (result.queryResult && result.queryResult.length > 0) {
                    resultTable.innerHTML = buildResultTable(result.queryResult);
                } else {
                    resultTable.innerHTML = '';
                }
                
            } else {
                sqlOutput.textContent = '生成失败：' + result.errorMessage;
                statusBadge.innerHTML = '<span class="status-badge status-error">❌ 生成失败</span>';
                stats.innerHTML = '';
                resultTable.innerHTML = '';
            }
        }
        
        // 构建结果表格
        function buildResultTable(data) {
            if (!data || data.length === 0) return '';
            
            const keys = Object.keys(data[0]);
            
            let html = '<h3 style="margin-top: 30px; margin-bottom: 15px;">📊 查询结果</h3>';
            html += '<table>';
            html += '<thead><tr>';
            keys.forEach(key => {
                html += `<th>${key}</th>`;
            });
            html += '</tr></thead>';
            html += '<tbody>';
            
            data.forEach(row => {
                html += '<tr>';
                keys.forEach(key => {
                    html += `<td>${row[key] !== null ? row[key] : 'NULL'}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            return html;
        }
        
        // 复制SQL
        function copySQL() {
            const sqlOutput = document.getElementById('sqlOutput');
            const text = sqlOutput.innerText || sqlOutput.textContent;
            
            if (!text || text.trim() === '') {
                alert('没有可复制的SQL！');
                return;
            }
            
            // 兼容不同浏览器的复制方法
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('SQL已复制到剪贴板！');
                }).catch(err => {
                    // 降级到传统方法
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        
        // 降级复制方法（兼容老浏览器）
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                alert('SQL已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请手动复制');
            }
            
            document.body.removeChild(textarea);
        }
        
        // 清空输出
        function clearOutput() {
            document.getElementById('outputSection').classList.remove('show');
        }
        
        // 报错反馈
        function reportError() {
            const errorSection = document.getElementById('errorSection');
            const sqlOutput = document.getElementById('sqlOutput');
            const errorFeedback = document.getElementById('errorFeedback');
            
            // 自动保存当前SQL到隐藏字段
            const currentSQL = sqlOutput.textContent.trim();
            if (currentSQL) {
                // 将当前SQL存储到页面（用于下次请求）
                document.getElementById('previousSQL').value = currentSQL;
            }
            
            errorSection.style.display = 'block';
            
            // 滚动到错误反馈框
            errorSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 聚焦到错误反馈输入框
            setTimeout(() => {
                errorFeedback.focus();
            }, 300);
        }
        
        // 清除错误反馈
        function clearError() {
            document.getElementById('errorFeedback').value = '';
            document.getElementById('previousSQL').value = '';
            document.getElementById('errorSection').style.display = 'none';
        }
        
        // 填充示例（通用）
        function fillExample(text) {
            document.getElementById('queryInput').value = text;
        }
        
        // 回车键生成
        document.getElementById('queryInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                generateSQL();
            }
        });
    </script>
</body>
</html>
